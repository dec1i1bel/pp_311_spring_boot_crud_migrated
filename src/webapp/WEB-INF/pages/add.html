<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление пользователя</title>
</head>
<body>
<h1>Добавление пользователя</h1>
<div th:if="${messageSuccess}">
    <p th:text="${messageSuccess}"></p>
</div>
<p>Поля * обязательны для заполнения</p>
<form th:action="@{/add}" method="post" th:object="${user}">
    <div>
        <label for="name">*Имя:</label>
        <input
                type="text"
                id="name"
                name="name"
                th:field="*{name}"
                required />
        <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        <br>
    </div>
    <br>
    <div>
        <label for="phone">*Номер телефона:</label>
        <input
                type="text"
                id="phone"
                name="phone"
                th:field="*{phone}"
                placeholder="+7XXXXXXXXXX или 8XXXXXXXXXX"
                style="width: 215px"
                required />
        <div th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
        <br>
    </div>
    <br>
    <div>
        <label for="email">*Email:</label>
        <input
                type="email"
                id="email"
                name="email"
                th:field="*{email}"
                placeholder="your@email.ru"
                required />
        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        <br>
    </div>
    <br>
    <button type="submit">Добавить</button>
</form>
</body>
</html>
