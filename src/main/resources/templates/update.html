<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Изменение пользователя</title>
</head>
<body>
<h1>Изменение пользователя</h1>
<div th:if="${messageSuccess}">
    <p th:text="${messageSuccess}"></p>
</div>
<form th:action="@{/update}" method="post">
    <input
        type="hidden"
        id="id"
        name="id"
        th:value="${user.id}"
        required />
    <div>
        <label for="name">Имя:</label>
        <input
                type="text"
                id="name"
                name="name"
                th:value="${user.name}"
                required />
    </div>
    <br>
    <div>
        <label for="phone">Номер телефона:</label>
        <input
                type="text"
                id="phone"
                name="phone"
                placeholder="+7XXXXXXXXXX или 8XXXXXXXXXX"
                th:value="${user.phone}"
                required />
    </div>
    <br>
    <div>
        <label for="email">Email:</label>
        <input
                type="email"
                id="email"
                name="email"
                th:value="${user.email}"
                required />
    </div>
    <br>
    <button type="submit">Сохранить</button>
    <br>
    <a th:href="@{/}">На главную</a>
</form>
</body>
</html>
