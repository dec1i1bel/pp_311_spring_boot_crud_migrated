<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список пользователей</title>
</head>
<body>
<p th:if="${#lists.isEmpty(users)}">Пользователи не добавлены</p>
<div th:unless="${#lists.isEmpty(users)}">
    <div th:if="${messageSuccess}">
        <p th:text="${messageSuccess}"></p>
    </div>
    <h1 class="main-title">Список пользователей</h1>
    <table border="1">
        <thead>
        <tr>
            <th>Имя</th>
            <th>Телефон</th>
            <th>Email</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.name}"></td>
            <td th:text="${user.phone}"></td>
            <td th:text="${user.email}"></td>
            <td><a th:href="@{/update(id=${user.id})}">Изменить</a> | <a th:href="@{'/delete'(id=${user.id})}">Удалить</a></td>
        </tr>
        </tbody>
    </table>
    <p><a th:href="@{/add}">Добавить</a></p>
</div>
</body>
</html>
